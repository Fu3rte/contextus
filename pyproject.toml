[project]
name = "rag-learning"
version = "0.1.0"
description = "最基础的 RAG 知识文档问答：入库 -> 检索 -> 返回结果"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
